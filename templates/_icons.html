{# Inline SVG icons. Usage: {% from "_icons.html" import icon, trace %} then {{ icon('search') }} #}
{% macro icon(name) -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'search' -%}<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
{%- elif name == 'plus' -%}<path d="M12 5v14M5 12h14"/>
{%- elif name == 'minus' -%}<path d="M5 12h14"/>
{%- elif name == 'list' -%}<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
{%- elif name == 'user' -%}<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
{%- elif name == 'user-plus' -%}<circle cx="10" cy="8" r="4"/><path d="M2 21a8 8 0 0 1 13.3-6M19 14v6M16 17h6"/>
{%- elif name == 'pill' -%}<path d="M10.5 20.5 3.5 13.5a5 5 0 0 1 7-7l7 7a5 5 0 0 1-7 7Z"/><path d="m8.5 8.5 7 7"/>
{%- elif name == 'clock' -%}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == 'upload' -%}<path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/>
{%- elif name == 'download' -%}<path d="M12 3v12M7 10l5 5 5-5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/>
{%- elif name == 'edit' -%}<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
{%- elif name == 'trash' -%}<path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
{%- elif name == 'back' -%}<path d="M15 18l-6-6 6-6"/>
{%- elif name == 'chev' -%}<path d="m9 18 6-6-6-6"/>
{%- elif name == 'check' -%}<path d="M20 6 9 17l-5-5"/>
{%- elif name == 'alert' -%}<circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>
{%- elif name == 'lock' -%}<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
{%- elif name == 'logout' -%}<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
{%- elif name == 'swap' -%}<path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/>
{%- endif -%}
</svg>
{%- endmacro %}

{# The heartbeat trace from the logo, drawn as a line. #}
{% macro trace(cls='hero-trace') -%}
<svg class="{{ cls }}" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true"><path d="M0 84 H700 C716 84 720 64 734 64 C748 64 752 84 768 84 L790 84 L806 14 L824 112 L836 84 C852 84 858 60 878 60 C898 60 906 84 926 84 H1200"/></svg>
{%- endmacro %}
